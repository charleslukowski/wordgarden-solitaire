<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f39">
  <meta name="description" content="A calm, ad-free word association solitaire game.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Solitaire Associations — Wordgarden</title>
  <style>
    :root{color-scheme:light;--felt:#174b43;--felt2:#103d37;--cream:#fbf7ee;--ink:#24352f;--muted:#77877e;--gold:#f3c568;--mint:#c8ead6;--rose:#f4b0a1;--shadow:0 12px 24px #092d2940;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--felt2);color:var(--ink)}body{min-height:100svh;background:radial-gradient(ellipse at 50% 0,#28695c 0,#174b43 53%,#103d37 100%);overscroll-behavior:none;user-select:none}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #f3c568;outline-offset:3px}.app{min-height:100svh;max-width:560px;margin:0 auto;padding:calc(9px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));display:flex;flex-direction:column;gap:11px}.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;color:#fff}.brand{display:flex;gap:9px;align-items:center;font-weight:850;font-size:18px;letter-spacing:-.4px}.brandmark{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:#eec879;color:#26473c;font-size:20px;box-shadow:inset 0 1px #ffffff88}.icon-btn{width:42px;height:42px;border-radius:15px;background:#ffffff17;color:#fff;font-size:19px;display:grid;place-items:center}.levelbar{display:flex;align-items:center;justify-content:space-between;color:#e7f1e8;padding:0 2px 2px}.level-pill{background:#ffffff17;border:1px solid #ffffff1d;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}.moves{font-size:13px;color:#d4e3d9}.moves strong{font-size:19px;color:#fff;margin-right:4px}.moves.low strong{color:#ffc06c}.progressline{height:4px;border-radius:5px;background:#ffffff1c;margin-top:-8px;overflow:hidden}.progressline span{display:block;height:100%;background:linear-gradient(90deg,#f3c568,#f1da8f);border-radius:5px;transition:width .35s ease}.prompt{margin:0;color:#f5efe1;font-size:12px;font-weight:700;letter-spacing:.45px;text-align:center;text-transform:uppercase}.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.target{position:relative;min-height:87px;padding:8px 5px 7px;background:linear-gradient(155deg,#fffdf8,#f3eee2);border-radius:15px;box-shadow:0 5px 0 #c8c2b4,0 9px 14px #082b2740;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .16s,box-shadow .16s,background .16s}.target .emoji{font-size:18px;line-height:1}.target .name{font-weight:850;font-size:11px;line-height:1.05;text-align:center;letter-spacing:-.2px}.target .count{font-weight:750;font-size:10px;color:#89938a}.target.ready{background:linear-gradient(155deg,#fff8e4,#f7e8bf);box-shadow:0 5px 0 #d4b45e,0 9px 14px #082b2740;transform:translateY(-2px)}.target.complete{background:linear-gradient(155deg,#e3f5e8,#c6ebd2);box-shadow:0 5px 0 #83c296,0 8px 14px #082b2740}.target.complete:after{content:"✓";position:absolute;right:-4px;top:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:white;background:#429965;font-size:12px;font-weight:900}.tableau{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1;min-height:230px;align-content:start;padding-top:4px}.pile{position:relative;min-height:150px;border-radius:13px;background:#ffffff0b;border:1px dashed #ffffff20;padding:4px 3px;transition:background .15s,border .15s}.pile.drop-target{background:#ffffff18;border-color:#f3c568}.word-card{position:relative;width:100%;height:68px;border-radius:12px;background:linear-gradient(145deg,#fffefa,#f4efe4);box-shadow:0 3px 0 #c6c0b3,0 6px 12px #052b2733;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;transition:transform .15s,box-shadow .15s;z-index:1}.word-card+.word-card{margin-top:-17px}.word-card .symbol{font-size:15px;line-height:1.1}.word-card .word{font-size:11px;line-height:1.05;text-align:center;font-weight:820;letter-spacing:-.25px;overflow-wrap:anywhere}.word-card.back{background:repeating-linear-gradient(135deg,#dce8dc 0 6px,#c4d8ca 6px 12px);box-shadow:0 3px 0 #98b6a0;pointer-events:none}.word-card.back:after{content:"✿";color:#4e7865;font-size:22px}.word-card.selected{transform:translateY(-5px);box-shadow:0 5px 0 #d7aa4f,0 0 0 3px #f3c568,0 10px 16px #052b2766;z-index:4}.word-card.good{animation:pop .38s ease}.word-card.wrong{animation:shake .3s ease}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff45;font-size:27px}.bottom{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:10px;padding-top:4px}.tool-btn{min-width:78px;height:48px;border:1px solid #ffffff25;border-radius:16px;background:#ffffff12;color:#f5f2e9;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:760}.tool-btn .ico{font-size:18px}.tool-btn.primary{background:#f1c86c;color:#263f35;border-color:#f8d789;box-shadow:0 4px 0 #bf9650}.tool-btn:disabled{opacity:.38;cursor:default}.status{position:fixed;left:50%;bottom:calc(78px + var(--safe-bottom));transform:translate(-50%,10px);background:#fbf7ee;color:#263e34;padding:10px 15px;border-radius:99px;box-shadow:var(--shadow);font-size:13px;font-weight:760;opacity:0;pointer-events:none;transition:.18s;z-index:20;white-space:nowrap}.status.show{opacity:1;transform:translate(-50%,0)}.veil{position:fixed;inset:0;background:#071f1dcc;display:none;align-items:center;justify-content:center;padding:24px;z-index:30}.veil.open{display:flex}.modal{width:min(100%,380px);background:var(--cream);border-radius:26px;padding:25px 22px 21px;text-align:center;box-shadow:0 24px 60px #041b18aa}.modal .medal{font-size:45px}.modal h2{font-size:24px;margin:8px 0 5px;letter-spacing:-.6px}.modal p{color:#65736a;font-size:14px;line-height:1.45;margin:0 0 19px}.modal-actions{display:flex;gap:9px}.modal-actions button{flex:1;height:46px;border-radius:14px;font-weight:800;background:#e9e4d9}.modal-actions .primary{background:#1c5b4d;color:#fff}.hint-ring{animation:ring 1.1s ease 2}.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}.confetti i{position:absolute;width:9px;height:14px;top:-20px;border-radius:3px;animation:fall 2.2s ease-in forwards}@keyframes pop{50%{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes ring{50%{box-shadow:0 0 0 5px #f3c568,0 5px 0 #d4b45e}}@keyframes fall{to{transform:translateY(110vh) rotate(560deg);opacity:.1}}.help-copy{font-size:13px;text-align:left;color:#506057;line-height:1.55}.help-copy b{color:#24352f}.help-copy li{margin:7px 0}.footnote{text-align:center;color:#b7cfc2;font-size:10px;letter-spacing:.15px;padding:1px 0}
    @media(max-width:360px){.app{padding-left:10px;padding-right:10px;gap:9px}.targets,.tableau{gap:6px}.target{min-height:81px}.target .name{font-size:10px}.word-card{height:64px}.word-card .word{font-size:10px}.tool-btn{min-width:71px}.brand{font-size:16px}}
    @media(min-height:800px){.tableau{min-height:280px}.word-card{height:74px}.word-card+.word-card{margin-top:-19px}.target{min-height:92px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app" aria-label="Wordgarden solitaire game">
    <header class="topbar"><div class="brand"><span class="brandmark">✿</span><span>Wordgarden</span></div><button class="icon-btn" id="helpBtn" aria-label="How to play" title="How to play">?</button></header>
    <section class="levelbar" aria-label="Game status"><span class="level-pill" id="level">LEVEL 1</span><span class="moves" id="moves"><strong>32</strong> moves left</span></section>
    <div class="progressline" aria-label="Level progress"><span id="progress" style="width:0%"></span></div>
    <p class="prompt">Sort each word into its family</p>
    <section class="targets" id="targets" aria-label="Word families"></section>
    <section class="tableau" id="tableau" aria-label="Card tableau"></section>
    <footer class="bottom" aria-label="Game controls">
      <button class="tool-btn" id="undoBtn"><span class="ico">↶</span><span>Undo</span></button>
      <button class="tool-btn primary" id="hintBtn"><span class="ico">✦</span><span>Hint</span></button>
      <button class="tool-btn" id="newBtn"><span class="ico">⟳</span><span>New deal</span></button>
    </footer>
    <div class="footnote">A little wordplay. No ads. No rush.</div>
  </main>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="medal" id="modalIcon">✿</div><h2 id="modalTitle"></h2><p id="modalText"></p><div class="modal-actions" id="modalActions"></div></div></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <script>
  (()=>{
    const packs=[[
      {name:'Birds',emoji:'🐦',words:[['Robin','🪶'],['Blue jay','💙'],['Sparrow','🌾'],['Cardinal','❤️']]},
      {name:'Coffee',emoji:'☕',words:[['Latte','🥛'],['Espresso','⚡'],['Mocha','🍫'],['Cappuccino','☁️']]},
      {name:'National parks',emoji:'🏞️',words:[['Zion','🧡'],['Acadia','🌊'],['Denali','🏔️'],['Yosemite','🌲']]},
      {name:'Dog breeds',emoji:'🐕',words:[['Beagle','🐾'],['Husky','❄️'],['Poodle','🎀'],['Boxer','🥊']]}
    ],[
      {name:'Trees',emoji:'🌳',words:[['Maple','🍁'],['Oak','🌰'],['Birch','🤍'],['Willow','🌿']]},
      {name:'Pasta',emoji:'🍝',words:[['Penne','📐'],['Fusilli','🌀'],['Rigatoni','⭕'],['Orzo','🌾']]},
      {name:'Instruments',emoji:'🎼',words:[['Cello','🎻'],['Flute','🪈'],['Trumpet','🎺'],['Drums','🥁']]},
      {name:'Weather',emoji:'🌦️',words:[['Fog','🌫️'],['Hail','🧊'],['Sleet','🌨️'],['Drizzle','🌧️']]}
    ],[
      {name:'Planets',emoji:'🪐',words:[['Venus','✨'],['Mars','🔴'],['Saturn','💍'],['Neptune','🔵']]},
      {name:'Gemstones',emoji:'💎',words:[['Ruby','❤️'],['Jade','🍃'],['Opal','🌈'],['Topaz','🌟']]},
      {name:'Baking',emoji:'🧁',words:[['Whisk','🥄'],['Batter','🥣'],['Rolling pin','🪵'],['Oven','🔥']]},
      {name:'Board games',emoji:'🎲',words:[['Chess','♟️'],['Catan','🏝️'],['Scrabble','🔤'],['Checkers','🔴']]}
    ]];
    let sets=packs[0];
    const $=s=>document.querySelector(s), targetsEl=$('#targets'), tableauEl=$('#tableau');
    let state,history=[],selected=null,toastTimer;
    const makeDeck=()=>sets.flatMap((s,si)=>s.words.map(([word,symbol],wi)=>({id:`${si}-${wi}-${Math.random().toString(36).slice(2,6)}`,word,symbol,group:si,face:false})));
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function deal(){
      const deck=shuffle(makeDeck()),columns=Array.from({length:4},()=>[]);
      // A little variety in each deal, while preserving four compact, readable columns.
      deck.forEach((c,i)=>columns[i%4].push(c));columns.forEach(col=>col[col.length-1].face=true);
      const level=Number(localStorage.getItem('wordgarden-level')||1);sets=packs[(level-1)%packs.length];state={level,moves:36,columns,done:sets.map(()=>[]),won:false};history=[];selected=null;render();closeModal();save();
    }
    function clone(s){return JSON.parse(JSON.stringify(s))}
    function save(){localStorage.setItem('wordgarden-save',JSON.stringify(state));localStorage.setItem('wordgarden-level',String(state.level))}
    function pushHistory(){history.push(clone(state));if(history.length>25)history.shift()}
    function restore(){const saved=localStorage.getItem('wordgarden-save');if(saved){try{state=JSON.parse(saved);if(!state.columns||!state.done)throw 0;sets=packs[((state.level||1)-1)%packs.length];render();if(state.won)setTimeout(()=>showModal('🌼','Beautifully sorted!',`Level ${state.level} is complete. Ready for another deal?`,[['Play next level',()=>{localStorage.setItem('wordgarden-level',String(state.level+1));deal()}]]),250);return}catch(e){}}deal()}
    function remaining(){return state.columns.reduce((n,c)=>n+c.length,0)}
    function render(){
      $('#level').textContent=`LEVEL ${state.level}`;$('#moves').innerHTML=`<strong>${state.moves}</strong> moves left`;$('#moves').classList.toggle('low',state.moves<=7);
      const total=sets.reduce((n,s)=>n+s.words.length,0),placed=state.done.reduce((n,a)=>n+a.length,0);$('#progress').style.width=`${Math.round(placed/total*100)}%`;
      targetsEl.innerHTML='';sets.forEach((s,i)=>{const count=state.done[i].length,el=document.createElement('button');el.type='button';el.className=`target ${count===s.words.length?'complete':''} ${selected&&selected.group===i?'ready':''}`;el.dataset.group=i;el.setAttribute('aria-label',`${s.name}, ${count} of ${s.words.length} words`);el.innerHTML=`<span class="emoji">${s.emoji}</span><span class="name">${s.name}</span><span class="count">${count} / ${s.words.length}</span>`;el.addEventListener('click',()=>tryPlace(i));targetsEl.append(el)});
      tableauEl.innerHTML='';state.columns.forEach((col,ci)=>{const pile=document.createElement('div');pile.className='pile';pile.dataset.pile=ci;if(!col.length)pile.innerHTML='<span class="empty">＋</span>';col.forEach((c,idx)=>{const card=document.createElement('button');card.type='button';card.className=`word-card ${c.face?'':'back'} ${selected&&selected.pile===ci&&selected.index===idx?'selected':''}`;card.dataset.pile=ci;card.dataset.index=idx;card.setAttribute('aria-label',c.face?c.word:'face-down card');if(c.face)card.innerHTML=`<span class="symbol">${c.symbol}</span><span class="word">${c.word}</span>`;if(c.face&&idx===col.length-1)card.addEventListener('click',()=>selectCard(ci,idx));pile.append(card)});pile.addEventListener('click',e=>{if(e.target===pile&&selected)moveToPile(ci)});tableauEl.append(pile)});
      $('#undoBtn').disabled=!history.length;save();
    }
    function say(message){const el=$('#status');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1850)}
    function selectCard(pile,index){if(state.won)return;const col=state.columns[pile];if(index!==col.length-1){say('Only the top card can move.');return}if(selected&&selected.pile!==pile){moveToPile(pile);return}if(selected&&selected.pile===pile&&selected.index===index){selected=null;render();return}selected={pile,index};render();say('Choose its family, or move it to another column.')}
    function tryPlace(group){if(!selected){say('Pick up a word card first.');return}const col=state.columns[selected.pile],card=col[selected.index];if(!card)return;if(card.group!==group){document.querySelectorAll('.target')[group].classList.add('hint-ring');setTimeout(()=>document.querySelectorAll('.hint-ring').forEach(e=>e.classList.remove('hint-ring')),950);say('That word belongs to another family.');return}pushHistory();state.columns[selected.pile].pop();if(state.columns[selected.pile].length)state.columns[selected.pile].at(-1).face=true;state.done[group].push(card);state.moves--;selected=null;render();say(['Lovely match!','That fits perfectly.','One more word home.'][Math.floor(Math.random()*3)]);checkEnd()}
    function moveToPile(dest){if(!selected)return;const {pile,index}=selected;if(dest===pile){selected=null;render();return}const source=state.columns[pile],card=source[index];if(!card||index!==source.length-1)return;pushHistory();source.pop();if(source.length)source.at(-1).face=true;state.columns[dest].push(card);card.face=true;state.moves--;selected=null;render();say('Card moved. Keep sorting!');checkEnd()}
    function checkEnd(){if(sets.every((s,i)=>state.done[i].length===s.words.length)){state.won=true;const next=state.level+1;localStorage.setItem('wordgarden-level',String(next));save();setTimeout(()=>{confetti();showModal('🌼','Beautifully sorted!',`Level ${state.level} complete in ${36-state.moves} moves. Ready for another deal?`,[['Play next level',deal]])},350);return}if(state.moves<=0){setTimeout(()=>showModal('🌱','One more try?',`You sorted ${state.done.reduce((n,a)=>n+a.length,0)} words. Shuffle up a fresh deal and have another go.`,[['New deal',deal]]),220)}}
    function undo(){if(!history.length)return;state=history.pop();selected=null;render();say('Last move undone.')}
    function hint(){if(selected){const i=selected.group;document.querySelectorAll('.target')[i].classList.add('hint-ring');setTimeout(()=>document.querySelectorAll('.hint-ring').forEach(e=>e.classList.remove('hint-ring')),1700);say(`Look for ${sets[i].name.toLowerCase()}.`);return}for(let ci=0;ci<state.columns.length;ci++){const col=state.columns[ci],card=col.at(-1);if(card){const t=document.querySelectorAll('.target')[card.group];t.classList.add('hint-ring');const c=tableauEl.querySelectorAll('.pile')[ci]?.querySelector('.word-card:last-child');if(c)c.classList.add('selected');setTimeout(()=>{document.querySelectorAll('.hint-ring').forEach(e=>e.classList.remove('hint-ring'));document.querySelectorAll('.word-card.selected').forEach(e=>e.classList.remove('selected'))},1700);say(`${card.word} goes with ${sets[card.group].name}.`);return}}say('All sorted!')}
    function showModal(icon,title,text,actions){$('#modalIcon').textContent=icon;$('#modalTitle').textContent=title;$('#modalText').textContent=text;const area=$('#modalActions');area.innerHTML='';actions.forEach(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;b.className=i===0?'primary':'';b.onclick=fn;area.append(b)});$('#veil').classList.add('open')}
    function closeModal(){$('#veil').classList.remove('open')}
    function confetti(){const host=$('#confetti');host.innerHTML='';const colors=['#f3c568','#b5e3c0','#ff9d82','#fff1be','#8dc7bc'];for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*.8+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;host.append(p)}setTimeout(()=>host.innerHTML='',3000)}
    $('#undoBtn').addEventListener('click',undo);$('#hintBtn').addEventListener('click',hint);$('#newBtn').addEventListener('click',()=>showModal('🔄','Start a new deal?','Your current board will be replaced with a fresh shuffle.',[['New deal',deal],['Keep playing',closeModal]]));
    $('#helpBtn').addEventListener('click',()=>{showModal('🪴','How to play','', [['Got it',closeModal]]);$('#modalText').innerHTML='<div class="help-copy"><ol><li>Tap a face-up word card in the tableau.</li><li>Tap the family it belongs to. Correct cards move into that family and uncover the next card.</li><li>Move a card to another column when you need to uncover what is below.</li><li>Sort all 16 words before you run out of moves. Undo and hints are always free.</li></ol></div>'});
    $('#veil').addEventListener('click',e=>{if(e.target===$('#veil'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='z'&&(e.ctrlKey||e.metaKey))undo()});
    restore();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  })();
  </script>
</body>
</html>
