:8px;font-weight:850;letter-spacing:.6px;text-transform:uppercase}.power-btn .badge{position:absolute;right:-8px;top:-9px;z-index:2;min-width:22px;height:22px;padding:0 4px;border-radius:99px;background:#e52b3b;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;box-shadow:0 2px 3px #002d19}.power-btn.undo{background:#4f8feb}.power-btn.joker{background:#f5c814;color:#5a4300;box-shadow:0 4px 0 #c79708,0 7px 9px #003b1c55}.power-btn.joker .badge{background:#e52b3b}.power-btn:disabled{opacity:.42;cursor:default}.power-btn.armed{box-shadow:0 0 0 3px #ffe344,0 4px 0 #c79708}.footnote{text-align:center;color:#b9dec5;font-size:8px;letter-spacing:.3px;padding:0;flex:none}.status{position:fixed;left:50%;bottom:calc(85px + var(--safe-bottom));transform:translate(-50%,10px);background:#fbf7ee;color:#263e34;padding:10px 15px;border-radius:99px;box-shadow:var(--shadow);font-size:12px;font-weight:760;opacity:0;pointer-events:none;transition:.18s;z-index:20;white-space:nowrap}.status.show{opacity:1;transform:translate(-50%,0)}.veil{position:fixed;inset:0;background:#00351ad9;display:none;align-items:center;justify-content:center;padding:22px;z-index:30}.veil.open{display:flex}.modal{width:min(100%,380px);background:var(--cream);border-radius:23px;padding:24px 20px 19px;text-align:center;box-shadow:0 24px 60px #001b0a99}.modal .medal{font-size:43px}.modal h2{font-size:23px;margin:8px 0 5px;letter-spacing:-.5px}.modal p{color:#65736a;font-size:14px;line-height:1.45;margin:0 0 17px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap}.modal-actions button{flex:1;min-width:90px;height:44px;border-radius:13px;font-weight:800;background:#e9e4d9}.modal-actions .primary{background:#148a47;color:#fff}.hint-ring{animation:ring 1.1s ease 2}.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}.confetti i{position:absolute;width:8px;height:13px;top:-20px;border-radius:3px;animation:fall 2.2s ease-in forwards}@keyframes pop{50%{transform:scale(1.07 <body>
  <main class="app" aria-label="Wordgarden solitaire game">
    <header class="topbar" aria-label="Game menu and progress">
      <button class="icon-btn" id="helpBtn" aria-label="Game menu" title="Game menu">☰</button>
      <button class="coin-chip" id="coinBtn" aria-label="Points earned by sorting cards"><span class="coin">●</span><strong id="coinCount">0</strong><span class="plus">+</span></button>
      <section class="foundations" id="foundations" aria-label="Completed categories"></section>
      <div class="crown-chip" aria-label="Free joker available"><span>♛</span><span id="topJokerCount">+1</span></div>
    </header>
    <section class="game-status" aria-label="Moves, waste, and stock">
      <div class="moves" id="moves"><span class="level-tag" id="level">LEVEL 4</span><span class="moves-label">Moves</span><strong id="moveCount">31</strong></div>
      <section class="stockrow" aria-label="Waste and draw piles">
        <div class="stockwrap"><button class="stockpile waste" id="wasteBtn" aria-label="Top card of waste pile"><span id="wasteCard" class="waste-card">—</span></button><span class="stock-caption">Waste</span></div>
        <div class="stockwrap"><button class="stockpile deck" id="stockBtn" aria-label="Draw a card"><span class="stock-count" id="stockCount">4</span></button><span class="stock-caption">Draw</span></div>
        <span id="recycleHint" class="recycle-hint" aria-live="polite">Tap draw to reveal a card</span>
      </section>
    </section>
    <div class="progressline" aria-label="Level progress"><span id="progress" style="width:0%"></span></div>
    <p class="prompt">Sort exposed cards into the category cards</p>
    <section class="tableau" id="tableau" aria-label="Five card columns"></section>
    <section class="targets" id="targets" aria-label="Category cards"></section>
    <footer class="bottom" aria-label="Power-ups">
      <button class="power-btn" id="hintBtn" aria-label="Hint, costs one move"><span class="power-icon">💡</span><span class="badge">−1</span><span class="power-label">Hint</span></button>
      <button class="power-btn undo" id="undoBtn" aria-label="Undo, costs one move"><span class="power-icon">↶</span><span class="badge">−1</span><span class="power-label">Undo</span></button>
      <button class="power-btn joker" id="jokerBtn" aria-label="Free joker"><span class="power-icon">🃏</span><span class="badge" id="jokerCount">1</span><span class="power-label">Joker</span></button>
    </footer>
    <div class="footnote">Wordgarden · ad-free play</div>
  </main>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="medal" id="modalIcon">✿</div><h2 id="modalTitle"></h2><p id="modalText"></p><div class="modal-actions" id="modalActions"></div></div></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

    function showModal(icon,title,text,actions){$('#modalIcon').textContent=icon;$('#modalTitle').textContent=title;$('#modalText').textContent=text;const area=$('#modalActions');area.innerHTML='';actions.forEach(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;b.className=i===0?'primary':'';b.onclick=fn;area.append(b)});$('#veil').classList.add('open')}function closeModal(){$('#veil').classList.remove('open')}
    function confetti(){const host=$('#confetti');host.innerHTML='';const colors=['#f3c568','#b5e3c0','#ff9d82','#fff1be','#8dc7bc'];for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*.8+'s';host.append(p)}setTimeout(()=>host.innerHTML='',3000)}
    function showHelp(){showModal('🪴','How to play','', [['Got it',closeModal]]);$('#modalText').innerHTML='<div class="help-copy"><ol><li>Sort each exposed word into its category card. Completed categories move to the four slots above the board.</li><li>Only the top card in each of the five columns and the top waste card can be played. Draw to reveal a stock card.</li><li>Every draw, match, wrong guess, move between columns, and hint uses a turn. Undo uses another turn and does not refund the action.</li><li>Each deal starts with 31 turns. Waste recycling is free. The one-use Joker sorts any exposed card for free.</li></ol></div>'}function confirmNew(){showModal('🔄','Start a new deal?','Your current board will be replaced with a fresh shuffle.',[['New deal',deal],['Keep playing',closeModal]])}$('#helpBtn').addEventListener('click',()=>showModal('☰','Game menu','', [['How to play',showHelp],['New deal',confirmNew]]));$('#coinBtn').addEventListener('click',()=>showModal('🪙','Points', 'Earn one point for each card sorted. Points are saved on this device.',[['Got it',closeModal]]));
    $('#stockBtn').addEventListener('click',draw);$('#wasteBtn').addEventListener('click',selectWaste);$('#jokerBtn').addEventListener('click',armJoker);$('#undoBtn').addEventListener('click',undo);$('#hintBtn').addEventListener('click',hint);
    $('#veil').addEventListener('click',e=>{if(e.target===$('#veil'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='z'&&(e.ctrlKey||e.metaKey))undo()});restore();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  })();
  </script>
