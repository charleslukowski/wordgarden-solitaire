<body>
  <main class="app" aria-label="Wordgarden solitaire game">
    <header class="topbar"><div class="brand"><span class="brandmark">✿</span><span>Wordgarden</span></div><button class="icon-btn" id="helpBtn" aria-label="How to play" title="How to play">?</button></header>
    <section class="levelbar" aria-label="Game status"><span class="level-pill" id="level">LEVEL 1</span><span class="moves" id="moves"><strong>32</strong> moves left</span></section>
    <div class="progressline" aria-label="Level progress"><span id="progress" style="width:0%"></span></div>
    <p class="prompt">Build each category before the deck runs dry</p>
    <section class="targets" id="targets" aria-label="Word families"></section>
    <section class="stockrow" aria-label="Stock and waste pile">
      <div class="stockwrap"><button class="stockpile" id="stockBtn" aria-label="Draw a card">↻<span class="stock-count" id="stockCount">0</span></button><span class="stock-caption">Draw pile</span></div>
      <div class="stockwrap"><button class="stockpile waste" id="wasteBtn" aria-label="Top card of waste pile"><span id="wasteCard">—</span></button><span class="stock-caption">Waste</span></div>
      <span id="recycleHint" class="stock-caption" style="max-width:92px;text-align:center">Tap draw to turn over a card</span>
    </section>
    <section class="tableau" id="tableau" aria-label="Card tableau"></section>
    <footer class="bottom" aria-label="Game controls">
      <button class="tool-btn" id="undoBtn"><span class="ico">↶</span><span>Undo</span></button>
      <button class="tool-btn primary" id="hintBtn"><span class="ico">✦</span><span>Hint</span></button>
      <button class="tool-btn joker" id="jokerBtn"><span class="ico">🃏</span><span>Joker ×1</span></button>
      <button class="tool-btn" id="newBtn"><span class="ico">⟳</span><span>New</span></button>
    </footer>
    <div class="footnote">A little wordplay. No ads. No rush.</div>
  </main>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="medal" id="modalIcon">✿</div><h2 id="modalTitle"></h2><p id="modalText"></p><div class="modal-actions" id="modalActions"></div></div></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

    let sets=packs[0];const $=s=>document.querySelector(s),targetsEl=$('#targets'),tableauEl=$('#tableau');let state,history=[],selected=null,jokerArmed=false,toastTimer;
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function newCard(word,symbol,group,face=false){return{id:Math.random().toString(36).slice(2),word,symbol,group,face}}
    function packIndex(level){const hardLevel=Math.max(4,Math.floor(Number(level)||4));return 3+((hardLevel-4)%(packs.length-3))}
    function deal(){const level=Math.max(4,Math.floor(Number(localStorage.getItem('wordgarden-level'))||4));localStorage.setItem('wordgarden-level',String(level));sets=packs[packIndex(level)];const moveBudget=31;const deck=shuffle(sets.flatMap((s,si)=>s.words.map(([word,symbol])=>newCard(word,symbol,si))));const columns=Array.from({length:4},()=>[]);for(let i=0;i<20;i++){columns[i%4].push(deck.pop())}columns.forEach(col=>col.at(-1).face=true);state={rules:6,level,moves:moveBudget,moveBudget,columns,stock:deck,waste:[],done:sets.map(()=>[]),jokers:1,won:false};history=[];selected=null;jokerArmed=false;render();closeModal();save()}
    function clone(s){return JSON.parse(JSON.stringify(s))}function save(){localStorage.setItem('wordgarden-save',JSON.stringify(state))}function pushHistory(){history.push(clone(state));if(history.length>50)history.shift()}
    function restore(){const saved=localStorage.getItem('wordgarden-save');if(saved){try{state=JSON.parse(saved);if(!state.columns||!state.done||!state.stock||!state.waste)throw 0;state.level=Math.floor(Number(state.level));if(!Number.isFinite(state.level)||state.level<4)throw 0;if(state.rules===5){if(state.level>21)throw 0;state.rules=6;state.moveBudget=31;state.moves=Math.max(0,Math.min(31,Number(state.moves)||0))}if(state.rules!==6)throw 0;sets=packs[packIndex(state.level)];render();if(state.won)setTimeout(()=>showModal('🌼','A perfect deal!',`Level ${state.level} is complete. Ready for your next category puzzle?`,[['Next level',deal]]),250);return}catch(e){}}deal()}
    const topCards=()=>state.columns.map((col,pile)=>col.length?{card:col.at(-1),source:'pile',pile}:null).filter(Boolean).concat(state.waste.length?[{card:state.waste.at(-1),source:'waste'}]:[]);
    function render(){
      $('#level').textContent=`LEVEL ${state.level}`;$('#moves').innerHTML=`<strong>${state.moves}</strong> moves left`;$('#moves').classList.toggle('low',state.moves<=15);const total=sets.reduce((n,s)=>n+s.words.length,0),placed=state.done.reduce((n,a)=>n+a.length,0);$('#progress').style.width=`${Math.round(placed/total*100)}%`;
      targetsEl.innerHTML='';sets.forEach((s,i)=>{const count=state.done[i].length,el=document.createElement('button');el.type='button';el.className=`target ${count===s.words.length?'complete':''} ${selected&&selected.group===i?'ready':''}`;el.setAttribute('aria-label',`${s.name}, ${count} of ${s.words.length} words`);el.innerHTML=`<span class="emoji">${s.emoji}</span><span class="name">${s.name}</span><span class="count">${count} / ${s.words.length}</span>`;el.addEventListener('click',()=>tryPlace(i));targetsEl.append(el)});
      $('#stockCount').textContent=state.stock.length||'↻';$('#stockBtn').classList.toggle('selected',jokerArmed);$('#stockBtn').disabled=false;$('#recycleHint').textContent=state.stock.length?`${state.stock.length} cards left to draw`:state.waste.length?'Tap draw to recycle waste':'All cards dealt';
      const wc=$('#wasteCard');if(state.waste.length){const c=state.waste.at(-1);wc.innerHTML=`<span>${c.symbol}</span><b>${c.word}</b>`;$('#wasteBtn').classList.toggle('selected',selected&&selected.source==='waste')}else{wc.textContent='—';$('#wasteBtn').classList.remove('selected')}
      tableauEl.innerHTML='';state.columns.forEach((col,ci)=>{const pile=document.createElement('div');pile.className='pile';pile.dataset.pile=ci;if(!col.length)pile.innerHTML='<span class="empty">＋</span>';col.forEach((c,idx)=>{const card=document.createElement('button');card.type='button';card.className=`word-card ${c.face?'':'back'} ${selected&&selected.source==='pile'&&selected.pile===ci?'selected':''}`;card.setAttribute('aria-label',c.face?c.word:'face-down card');if(c.face)card.innerHTML=`<span class="symbol">${c.symbol}</span><span class="word">${c.word}</span>`;if(c.face&&idx===col.length-1)card.addEventListener('click',()=>selectCard(ci));pile.append(card)});pile.addEventListener('click',e=>{if((e.target===pile||e.target.classList.contains('empty'))&&selected)moveToPile(ci)});tableauEl.append(pile)});
      $('#undoBtn').disabled=!history.length;$('#jokerBtn').textContent=`🃏 Joker ×${state.jokers}`;$('#jokerBtn').disabled=state.jokers<1;$('#jokerBtn').classList.toggle('armed',jokerArmed);save();
    }
    function say(message){const el=$('#status');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
    function sourceCard(src){return src.source==='waste'?state.waste.at(-1):state.columns[src.pile]?.at(-1)}
    function selectCard(pile){if(state.won)return;const col=state.columns[pile];if(!col.length)return;if(selected&&!jokerArmed&&selected.source==='pile'&&selected.pile===pile){selected=null;render();return}if(selected&&!jokerArmed&&selected.source==='pile'&&selected.pile!==pile){moveToPile(pile);return}if(selected&&!jokerArmed&&selected.source==='waste'){moveToPile(pile);return}selected={source:'pile',pile};if(jokerArmed){useJoker();return}render();say('Choose a category, or park this card in another column.')}
    function selectWaste(){if(!state.waste.length){say('Draw a card to the waste pile first.');return}selected={source:'waste'};if(jokerArmed){useJoker();return}render();say('Choose a category or move the waste card to a column.')}
    function tryPlace(group){if(!selected){say('Choose a face-up card first.');return}const card=sourceCard(selected);if(!card)return;pushHistory();state.moves--;if(card.group!==group){selected=null;render();document.querySelectorAll('.target')[group].classList.add('hint-ring');setTimeout(()=>document.querySelectorAll('.hint-ring').forEach(e=>e.classList.remove('hint-ring')),800);say('Not that family — one move used. Try another category.');checkEnd();return}takeSelected();state.done[group].push(card);selected=null;render();say(['Right on the money!','That fits perfectly.','Category complete soon!'][Math.floor(Math.random()*3)]);checkEnd()}
    function takeSelected(){if(selected.source==='waste')state.waste.pop();else{const col=state.columns[selected.pile];col.pop();if(col.length)col.at(-1).face=true}}
    function moveToPile(dest){if(!selected)return;if(selected.source==='pile'&&selected.pile===dest){selected=null;render();return}const card=sourceCard(selected);if(!card)return;pushHistory();takeSelected();card.face=true;state.columns[dest].push(card);state.moves--;selected=null;render();say('Parked. The move count tracks every turn.');checkEnd()}
    function draw(){if(state.stock.length){pushHistory();const card=state.stock.pop();if(card.joker){state.jokers++;say('Joker found! Use it to sort any exposed card for free.')}else{card.face=true;state.waste.push(card);state.moves--;say(`${card.word} turned up.`)}}else if(state.waste.length){pushHistory();state.stock=state.waste.reverse().map(c=>({...c,face:false}));state.waste=[];say('Waste recycled into the draw pile — free.')}else{say('No cards left in the draw pile.');return}selected=null;render();checkEnd()}
    function armJoker(){if(!state.jokers)return;jokerArmed=!jokerArmed;selected=null;render();say(jokerArmed?'Joker ready — choose any exposed card.':'Joker cancelled.')}
    function useJoker(){if(!jokerArmed||!selected)return;const card=sourceCard(selected);if(!card)return;pushHistory();takeSelected();state.done[card.group].push(card);state.jokers--;selected=null;jokerArmed=false;render();say(`Joker sorted ${card.word} for free.`);checkEnd()}
    function checkEnd(){if(sets.every((s,i)=>state.done[i].length===s.words.length)){state.won=true;save();localStorage.setItem('wordgarden-level',String(state.level+1));setTimeout(()=>{confetti();showModal('🌼','A perfect deal!',`Level ${state.level} cleared in ${state.moveBudget-state.moves} moves. Your next category puzzle is ready.`,[['Next level',deal]])},300);return}if(state.moves<=0){setTimeout(()=>showModal('🌱','Moves used up',`You sorted ${state.done.reduce((n,a)=>n+a.length,0)} of ${sets.reduce((n,s)=>n+s.words.length,0)} words. Your progress is saved, or you can deal again.`,[['Deal again',deal],['Keep board',closeModal]]),180)}}
    function undo(){if(!history.length)return;const movesAfterAction=state.moves;state=history.pop();state.moves=Math.max(0,Math.min(state.moves,movesAfterAction)-1);selected=null;jokerArmed=false;render();say('Undone — 1 turn used.');checkEnd()}
    function hint(){const pick=selected?sourceCard(selected):topCards()[0]?.card;if(!pick){say('Draw a card or uncover one to get a hint.');return}if(state.moves<=0){say('No turns left for a hint.');return}state.moves--;render();const i=pick.group;document.querySelectorAll('.target')[i].classList.add('hint-ring');setTimeout(()=>document.querySelectorAll('.hint-ring').forEach(e=>e.classList.remove('hint-ring')),1500);say(`${pick.word} belongs with ${sets[i].name}. Hint used 1 turn.`);checkEnd()}
    function showModal(icon,title,text,actions){$('#modalIcon').textContent=icon;$('#modalTitle').textContent=title;$('#modalText').textContent=text;const area=$('#modalActions');area.innerHTML='';actions.forEach(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;b.className=i===0?'primary':'';b.onclick=fn;area.append(b)});$('#veil').classList.add('open')}function closeModal(){$('#veil').classList.remove('open')}
    function confetti(){const host=$('#confetti');host.innerHTML='';const colors=['#f3c568','#b5e3c0','#ff9d82','#fff1be','#8dc7bc'];for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*.8+'s';host.append(p)}setTimeout(()=>host.innerHTML='',3000)}
    $('#stockBtn').addEventListener('click',draw);$('#wasteBtn').addEventListener('click',selectWaste);$('#jokerBtn').addEventListener('click',armJoker);$('#undoBtn').addEventListener('click',undo);$('#hintBtn').addEventListener('click',hint);$('#newBtn').addEventListener('click',()=>showModal('🔄','Start a new deal?','Your current board will be replaced with a fresh shuffle.',[['New deal',deal],['Keep playing',closeModal]]));
    $('#helpBtn').addEventListener('click',()=>{showModal('🪴','How to play','', [['Got it',closeModal]]);$('#modalText').innerHTML='<div class="help-copy"><ol><li>Build each named category. The count on its tile shows how many cards belong there.</li><li>Only the top card in a column and the top waste card are playable. Tap Draw to turn over a new card.</li><li>Move cards between columns to uncover hidden words. Every draw, match, wrong guess, and move spends one turn.</li><li>Hard mode starts at Level 4. Each round gives you 31 turns. Drawing, matching, wrong guesses, column moves, and hints each use a turn. Undo also costs a turn and does not refund the action. Waste recycling is free; the one-use Joker sorts any exposed card for free.</li></ol></div>'});
    $('#veil').addEventListener('click',e=>{if(e.target===$('#veil'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='z'&&(e.ctrlKey||e.metaKey))undo()});restore();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
